name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract complete source from zip
        run: |
          set -e
          if [ -f PhoneLink-v2-3.zip ]; then
            echo "Extracting PhoneLink-v2-3.zip..."
            unzip -o -q PhoneLink-v2-3.zip
          elif [ -f PhoneLink-v2.zip ]; then
            echo "Extracting PhoneLink-v2.zip..."
            unzip -o -q PhoneLink-v2.zip
          fi
          if [ -d PhoneLink ] && [ -f PhoneLink/settings.gradle.kts ]; then
            echo "Merging PhoneLink/ into repo root..."
            cp -a PhoneLink/. .
            rm -rf PhoneLink
          fi
          echo "=== Project root ==="
          ls -la
          test -f settings.gradle.kts
          test -d app/src/main/java/com/phonelink/app
          ls app/src/main/java/com/phonelink/app/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
